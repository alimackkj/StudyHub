<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #DAC9DF !important;">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #6f42c1;">
            <div class="container">
                <a href="index.html" class="navbar-brand fw-bold">StudyHub</a>
                <div id="menuNav" class="navbar-nav ms-auto d-flex flex-row gap-3"></div>
            </div>
        </nav>
    </header>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow border-0">
                    <h3 class="fw-bold mb-3 text-center" style="color: #6f42c1;">Entrar no StudyHub</h3>
                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="loginInput" class="form-label fw-bold">Usuário / Login</label>
                            <input type="text" id="loginInput" class="form-control" required placeholder="admin ou user">
                        </div>
                        <div class="mb-4">
                            <label for="senhaInput" class="form-label fw-bold">Senha</label>
                            <input type="password" id="senhaInput" class="form-control" required placeholder="123">
                        </div>
                        <button type="submit" class="btn w-100 text-white fw-bold mb-3" style="background-color: #6f42c1;">Entrar</button>
                        <p class="text-center mb-0 small">Não tem uma conta? <a href="cadastro_usuario.html" style="color: #6f42c1;">Cadastre-se aqui</a></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <h5 class="text-info mb-2">Sobre a Desenvolvedora</h5>
            <p class="mb-0 text-secondary">Trabalho Prático - PUC Minas | Desenvolvido por: <a href="https://www.linkedin.com/in/camila-evangelista-34b737344/" target="_blank" class="text-white text-decoration-underline fw-bold">Camila Fernanda Evangelista</a></p>
        </div>
    </footer>

    <script src="../assets/scripts/app.js"></script>
    <script>
        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault();
            const loginVal = document.getElementById('loginInput').value;
            const senhaVal = document.getElementById('senhaInput').value;
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            const encontrado = usuarios.find(u => u.login === loginVal && u.senha === senhaVal);

            if (encontrado) {
                sessionStorage.setItem('usuarioLogado', JSON.stringify(encontrado));
                window.location.href = 'index.html';
            } else {
                alert('Usuário ou senha incorretos! (Tente admin/123 ou user/123)');
            }
        });
    </script>
</body>
</html>
