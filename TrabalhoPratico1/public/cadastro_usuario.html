<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - Cadastro de Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #DAC9DF !important;">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #6f42c1;">
            <div class="container">
                <a href="index.html" class="navbar-brand fw-bold">StudyHub</a>
                <div id="menuNav" class="navbar-nav ms-auto d-flex flex-row gap-3"></div>
            </div>
        </nav>
    </header>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow border-0">
                    <h3 class="fw-bold mb-3 text-center" style="color: #6f42c1;">Criar Conta</h3>
                    <form id="formCadastro">
                        <div class="mb-3">
                            <label for="nomeCad" class="form-label fw-bold">Nome Completo</label>
                            <input type="text" id="nomeCad" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailCad" class="form-label fw-bold">E-mail</label>
                            <input type="email" id="emailCad" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginCad" class="form-label fw-bold">Nome de Usuário (Login)</label>
                            <input type="text" id="loginCad" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label for="senhaCad" class="form-label fw-bold">Senha</label>
                            <input type="password" id="senhaCad" class="form-control" required>
                        </div>
                        <button type="submit" class="btn w-100 text-white fw-bold mb-3" style="background-color: #6f42c1;">Registrar</button>
                        <p class="text-center mb-0 small">Já tem conta? <a href="login.html" style="color: #6f42c1;">Faça login</a></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <h5 class="text-info mb-2">Sobre a Desenvolvedora</h5>
            <p class="mb-0 text-secondary">Trabalho Prático - PUC Minas | Desenvolvido por: <a href="https://www.linkedin.com/in/camila-evangelista-34b737344/" target="_blank" class="text-white text-decoration-underline fw-bold">Camila Fernanda Evangelista</a></p>
        </div>
    </footer>

    <script src="../assets/scripts/app.js"></script>
    <script>
        document.getElementById('formCadastro').addEventListener('submit', (e) => {
            e.preventDefault();
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            const novoUser = {
                id: Date.now().toString(),
                nome: document.getElementById('nomeCad').value,
                email: document.getElementById('emailCad').value,
                login: document.getElementById('loginCad').value,
                senha: document.getElementById('senhaCad').value,
                admin: false // por padrão novos cadastros são comuns
            };

            // Valida se o login ja existe
            if(usuarios.some(u => u.login === novoUser.login)) {
                alert('Este nome de usuário já está sendo utilizado!');
                return;
            }

            usuarios.push(novoUser);
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            alert('Conta criada com sucesso! Faça seu login.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
