<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #DAC9DF !important;">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #6f42c1;">
            <div class="container">
                <a href="index.html" class="navbar-brand fw-bold">StudyHub</a>
                <div id="menuNav" class="navbar-nav ms-auto d-flex flex-row gap-3">
                    </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section class="mb-5">
            <h2 class="mb-4 text-dark fw-bold">Cursos em Destaque</h2>
            <div id="carouselDestaques" class="carousel slide" data-bs-ride="carousel">
                <div id="carouselInner" class="carousel-inner rounded shadow"></div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselDestaques" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselDestaques" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Próximo</span>
                </button>
            </div>
        </section>

        <section class="mb-5">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <h2 class="text-dark fw-bold mb-0">Todos os Cursos</h2>
                <div class="w-100 style-search" style="max-width: 400px;">
                    <input type="text" id="campoPesquisa" class="form-control shadow-sm" placeholder="🔍 Pesquise por título ou descrição...">
                </div>
            </div>
            <div id="listaTodos" class="row row-cols-1 row-cols-md-3 g-4"></div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <h5 class="text-info mb-2">Sobre a Desenvolvedora</h5>
            <p class="mb-0 text-secondary">
                Trabalho Prático - PUC Minas | Desenvolvido por: 
                <a href="https://www.linkedin.com/in/camila-evangelista-34b737344/" target="_blank" class="text-white text-decoration-underline fw-bold">Camila Fernanda Evangelista</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/scripts/app.js"></script>
</body>
</html>
